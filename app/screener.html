<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fund screener &mdash; FinChaya</title>
<meta name="description" content="Build your own fund screen &mdash;
  category, benchmark, Sharpe, Sortino, drawdown, rolling consistency
  &mdash; and watch the list on the right update as you go.">
<link rel="stylesheet" href="/finchaya.css">
<script src="/finchaya.js" defer></script>
<!--
  screener.html -- filters on the left, one results panel on the right.
  =====================================================================
  THIRD SHAPE, AND WHY
      v1 was five fixed named screens as cards. v2 put every filter in a
      panel of pills. v3 turned it into a scrolling chat transcript, one
      question at a time -- friendlier, but the fund list got printed
      again after every single answer, so finding "the list" meant
      scrolling past every earlier copy of it.

      This keeps v3's plain-language questions and its trail of chips,
      but splits the page in two: the QUESTION lives in a sidebar that
      always shows only the current one (plus what has already been
      chosen, as removable chips), and the ANSWER lives in one results
      panel that is redrawn in place every time, never appended to.
      Nothing scrolls out of reach, and nothing is ever printed twice.

  WHY PRESETS READ THE CURRENT POOL, NOT THE WHOLE UNIVERSE
      An early version priced "average" and "top quartile" off all 1,074
      funds. Narrow to Small Cap first and ask for "calmer than average"
      drawdown and every small-cap fund can legitimately sit above the
      WHOLE MARKET's median -- zero results, for a preset that promised
      roughly half. Every preset here is computed from whatever the
      reader has already narrowed to, so it can never empty the list it
      is being added to.

  WHY ONE FETCH STILL COVERS EVERYTHING FOR A GIVEN PERIOD/WINDOW
      /api/portfolio/screen-universe returns every fund's category, its
      point-to-point figures (scoped to `period`) and its rolling-window
      figures (scoped to `risk_window`) in one payload. Changing the
      period or window is the only thing that needs a new request, and
      even that is cached by "period|window" so a combination already
      seen never re-fetches.
-->
<style>
  .layout{display:flex;align-items:flex-start;gap:22px}
  .sidebar{flex:0 0 320px;background:var(--card);border-radius:var(--r-card);
    box-shadow:var(--shadow);padding:22px 20px}
  /* Named screenResults, not results -- finchaya.css already owns
     .results for the search-autocomplete dropdown (position:absolute),
     and it loads after this page's own <style>, so a plain .results
     here would silently lose the cascade and be pulled out of the flex
     layout by that unrelated rule. */
  .screenResults{flex:1;min-width:0;background:var(--card);
    border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px 24px}
  @media (max-width:860px){
    .layout{flex-direction:column}
    .sidebar{flex:1 1 auto;width:100%}
  }

  /* ---- the trail: what has already been chosen, removable ---------- */
  .trail{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
  .trail:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;
    background:var(--brand-wash);border:1px solid var(--brand);
    border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;
    color:var(--ink)}
  .chip button{appearance:none;border:0;background:none;cursor:pointer;
    color:var(--brand-dark);font-size:15px;line-height:1;padding:2px 5px;
    border-radius:50%}
  .chip button:hover{background:#fff;color:var(--neg)}

  .funnel{font-size:12.5px;color:var(--muted);margin:0 0 var(--s3);
    line-height:1.7}
  .funnel:empty{display:none}

  .sidehead{font-size:14px;font-weight:600;margin:0 0 10px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
  .pill{background:var(--surface);border:1.5px solid var(--line-firm);
    border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:550;
    color:var(--ink-2);cursor:pointer;text-align:left}
  .pill:hover{border-color:var(--brand);color:var(--ink)}
  .pill.big{display:block;width:100%;border-radius:var(--r);padding:10px 14px}
  .pillcount{color:var(--muted);font-size:12px;margin-left:4px}

  .qwhat{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.45}
  .backlink{background:none;border:0;color:var(--muted);font-size:13px;
    cursor:pointer;padding:4px 0;margin-top:4px}
  .backlink:hover{color:var(--ink)}

  .utilrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;
    padding-top:14px;border-top:1px solid var(--line)}
  .utilbtn{background:none;border:1px solid var(--line-firm);
    border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);
    cursor:pointer}
  .utilbtn:hover{border-color:var(--brand);color:var(--ink)}

  /* ---- results ------------------------------------------------------ */
  .rhead{font-size:15px;margin:0 0 var(--s2)}
  .rhead b{font-variant-numeric:tabular-nums}
  .frows{display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:12px 14px;border:1px solid var(--line-firm);
    border-radius:var(--r);text-decoration:none;color:inherit}
  .frow:hover{border-color:var(--brand)}
  .fname b{display:block;font-size:14.5px;line-height:1.3}
  .fsub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .fval{flex:none;font-size:13.5px;font-weight:700;color:var(--brand-dark);
    white-space:nowrap}
  @media (max-width:480px){.frow{flex-wrap:wrap}.fval{margin-left:auto}}
</style>
</head>
<body>

<div class="wrap">

  <p class="eyebrow">Fund screener</p>
  <h1>Build your own screen</h1>
  <p class="note">Pick filters on the left &mdash; category, benchmark,
    Sharpe, Sortino, drawdown, consistency &mdash; and the list on the
    right updates as you go.</p>

  <div class="layout">
    <aside class="sidebar">
      <div class="trail" id="trail"></div>
      <div class="funnel" id="funnel"></div>
      <div id="builderHost"></div>
      <div class="utilrow" id="utilrow"></div>
    </aside>

    <section class="screenResults">
      <p class="rhead" id="rhead"></p>
      <div class="frows" id="frows"></div>
      <p class="foot" id="rfoot"></p>
    </section>
  </div>

</div>

<script>
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const nfmt = n => n.toLocaleString("en-IN");

const PERIODS = ["1Y", "3Y", "5Y", "7Y", "10Y"];
const PERIOD_LABEL = {"1Y": "1 year", "3Y": "3 years", "5Y": "5 years",
                       "7Y": "7 years", "10Y": "10 years"};
const WINDOWS = [1, 3, 5];

// Every filter besides category. `src` is the /screen-universe field it
// reads; `dir` says which side of the number is "better" -- "min" is
// at-least, "max" is at-most. Presets are resolved against whatever the
// reader has already narrowed to -- see resolveThreshold().
const FILTER_DEFS = [
  {
    key: "beat", axis: "period", label: "Beats its benchmark",
    what: "How far ahead of its own benchmark index the fund finished "
        + "over the period you pick.",
    src: "ex", dir: "min",
    presets: [["Beat it at all", 0], ["Comfortably ahead", "p50"],
              ["Well ahead", "p75"]],
    fmtValue: v => (v > 0 ? "+" : "") + v.toFixed(1) + " pts/yr",
  },
  {
    key: "rank", axis: "period", label: "Rank within its category",
    what: "Where it sits among funds doing the same job. Lower is "
        + "better.",
    src: "rs", dir: "max",
    presets: [["Better half", 50], ["Top quarter", 25], ["Top 10%", 10]],
    fmtValue: v => "Top " + Math.max(1, Math.round(v)) + "%",
  },
  {
    key: "sharpe", axis: "window", label: "Sharpe ratio",
    what: "Return earned per unit of overall turbulence taken.",
    src: "sh", dir: "min",
    presets: [["Above average", "p50"], ["At least 1", 1],
              ["Top quarter", "p75"]],
    fmtValue: v => "Sharpe " + v.toFixed(2),
  },
  {
    key: "sortino", axis: "window", label: "Sortino ratio",
    what: "Like Sharpe, but only downside swings count against the "
        + "fund.",
    src: "so", dir: "min",
    presets: [["Above average", "p50"], ["At least 1", 1],
              ["Top quarter", "p75"]],
    fmtValue: v => "Sortino " + v.toFixed(2),
  },
  {
    key: "vol", axis: "window", label: "Volatility (calmer ride)",
    what: "How far the value swings around its own average in a "
        + "typical year. Lower is calmer.",
    src: "vo", dir: "max",
    presets: [["Calmer than average", "p50"], ["Among the calmest", "p25"]],
    fmtValue: v => v.toFixed(1) + "% volatility",
  },
  {
    key: "dd", axis: "window", label: "Maximum drawdown",
    what: "The deepest fall from a high point to the low that "
        + "followed. Lower is better.",
    src: "dd", dir: "max",
    presets: [["Fell less than average", "p50"], ["Held up best", "p25"]],
    fmtValue: v => "-" + v.toFixed(1) + "% worst fall",
  },
  {
    key: "consistent", axis: "window", label: "Consistent rolling returns",
    what: null, // filled in once the hurdle rate is known -- see openThreshold
    src: "ph", dir: "min",
    presets: [["Most of the time", 50], ["Almost always", 75],
              ["Nearly every time", 90]],
    fmtValue: v => "Cleared it " + Math.round(v) + "% of the time",
  },
];

let STATE = {period: "1Y", window: 3};
let periodAsked = false, windowAsked = false;
let steps = [];          // [{type:"category", value} | {type:filterKey, threshold, presetLabel}]
let ALL = null, HURDLE = 12;

// What the sidebar is showing right now.
//   open: null | filter key | "category" | "__period__" | "__window__"
//   stage: "period" | "window" | "main" (category picker or threshold picker)
let open = null, stage = null;

const CACHE = new Map();   // "period|window" -> {data, err}
async function ensureUniverse(period, window) {
  const key = period + "|" + window;
  if (CACHE.has(key)) return CACHE.get(key);
  const entry = {data: null, err: null};
  CACHE.set(key, entry);
  try {
    const r = await fetch("/api/portfolio/screen-universe?period="
      + encodeURIComponent(period) + "&risk_window=" + encodeURIComponent(window));
    if (!r.ok) entry.err = r.status;
    else entry.data = await r.json();
  } catch (e) {
    entry.err = 0;
  }
  return entry;
}
async function loadUniverse(period, window) {
  const {data, err} = await ensureUniverse(period, window);
  if (err) return err;
  STATE.period = period; STATE.window = window;
  ALL = data.funds;
  HURDLE = data.hurdle_pct != null ? data.hurdle_pct : 12;
  return null;
}

/* ---- the filters themselves ------------------------------------------ */
function stepPasses(f, step) {
  if (step.type === "category") return f.k === step.value;
  const def = FILTER_DEFS.find(d => d.key === step.type);
  const v = f[def.src];
  if (v == null) return false;
  return def.dir === "min" ? v >= step.threshold : v <= step.threshold;
}
function currentPool(upTo) {
  let pool = ALL;
  const use = upTo == null ? steps : steps.slice(0, upTo);
  use.forEach(s => { pool = pool.filter(f => stepPasses(f, s)); });
  return pool;
}
function stepChipLabel(step) {
  if (step.type === "category") return "Category: " + step.value;
  const def = FILTER_DEFS.find(d => d.key === step.type);
  return def.label + ": " + step.presetLabel;
}
function sortPool(pool) {
  const last = [...steps].reverse().find(s => s.type !== "category");
  if (last) {
    const def = FILTER_DEFS.find(d => d.key === last.type);
    return [...pool].sort((a, b) => def.dir === "min"
      ? b[def.src] - a[def.src] : a[def.src] - b[def.src]);
  }
  return [...pool].sort((a, b) => (b.cg == null ? -1e9 : b.cg)
                                 - (a.cg == null ? -1e9 : a.cg));
}
function rowMetric(f) {
  const last = [...steps].reverse().find(s => s.type !== "category");
  if (last) {
    const def = FILTER_DEFS.find(d => d.key === last.type);
    const v = f[def.src];
    return v == null ? "–" : def.fmtValue(v);
  }
  return f.cg != null ? f.cg.toFixed(1) + "% CAGR" : "–";
}
// Presets are read off whatever the reader has ALREADY narrowed to, not
// the whole fund universe -- see the file-header comment for why.
function resolveThreshold(def, presetValue, pool) {
  if (typeof presetValue === "number") return presetValue;
  const vals = pool.map(f => f[def.src]).filter(v => v != null).sort((a, b) => a - b);
  if (!vals.length) return null;
  const p = Number(presetValue.slice(1)) / 100;
  return vals[Math.min(vals.length - 1, Math.floor(p * (vals.length - 1)))];
}

/* ---- rendering: trail + funnel ---------------------------------------- */
function renderTrail() {
  const el = document.getElementById("trail");
  el.innerHTML = steps.map((s, i) => `
    <span class="chip">${esc(stepChipLabel(s))}
      <button type="button" data-i="${i}" aria-label="Remove this filter">&times;</button>
    </span>`).join("");
  el.querySelectorAll("button[data-i]").forEach(b =>
    b.addEventListener("click", () => { steps.splice(Number(b.dataset.i), 1); renderAll(); }));
}
function renderFunnel() {
  const el = document.getElementById("funnel");
  if (!steps.length) { el.innerHTML = ""; return; }
  const rows = ["All funds: <b>" + nfmt(ALL.length) + "</b>"];
  steps.forEach((s, i) => rows.push(esc(stepChipLabel(s)) + ": <b>"
    + nfmt(currentPool(i + 1).length) + "</b>"));
  el.innerHTML = rows.map(r => "<div>" + r + "</div>").join("");
}

/* ---- rendering: the sidebar question ----------------------------------- */
function categoryOptions(pool) {
  const counts = {};
  pool.forEach(f => { if (f.k) counts[f.k] = (counts[f.k] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function renderBuilder() {
  const host = document.getElementById("builderHost");
  const pool = currentPool();

  if (stage === "period") {
    host.innerHTML = `<p class="sidehead">Over what period should I compare returns?</p>
      <div class="pills" id="periodPills">
        ${PERIODS.map(p => `<button type="button" class="pill" data-p="${p}">${p}</button>`).join("")}
      </div>
      ${open === "__period__" ? '<button type="button" class="backlink" id="back">Cancel</button>' : ""}`;
    host.querySelectorAll("[data-p]").forEach(b =>
      b.addEventListener("click", () => choosePeriod(b.dataset.p)));
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", closePanel);
    return;
  }
  if (stage === "window") {
    host.innerHTML = `<p class="sidehead">Over what rolling window?</p>
      <div class="pills" id="windowPills">
        ${WINDOWS.map(w => `<button type="button" class="pill" data-w="${w}">${
          w}${w === 1 ? " year" : " years"}</button>`).join("")}
      </div>
      ${open === "__window__" ? '<button type="button" class="backlink" id="back">Cancel</button>' : ""}`;
    host.querySelectorAll("[data-w]").forEach(b =>
      b.addEventListener("click", () => chooseWindow(Number(b.dataset.w))));
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", closePanel);
    return;
  }

  if (open === "category") {
    const cats = categoryOptions(pool);
    host.innerHTML = `<p class="sidehead">Which category are you interested in?</p>
      <div class="pills">
        ${cats.map(([name, n]) => `<button type="button" class="pill big" data-cat="${esc(name)}">
          ${esc(name)}<span class="pillcount">${n}</span></button>`).join("")}
      </div>
      <button type="button" class="backlink" id="back">Cancel</button>`;
    host.querySelectorAll("[data-cat]").forEach(b =>
      b.addEventListener("click", () => chooseCategory(b.dataset.cat)));
    document.getElementById("back").addEventListener("click", closePanel);
    return;
  }

  if (open) {
    const def = FILTER_DEFS.find(d => d.key === open);
    const what = open === "consistent"
      ? "Share of rolling " + STATE.window + "-year windows that cleared a "
        + HURDLE + "%/yr hurdle, not just the one everybody happens to quote."
      : def.what;
    const presets = def.presets
      .map(([label, pr]) => ({label, value: resolveThreshold(def, pr, pool)}))
      .filter(p => p.value != null);
    host.innerHTML = `<p class="sidehead">${esc(def.label)}</p>
      <p class="qwhat">${esc(what)}</p>
      <div class="pills">
        ${presets.map(p => `<button type="button" class="pill" data-th="${p.value}"
            data-label="${esc(p.label)}">${esc(p.label)}</button>`).join("")
          || '<span class="qwhat">Not enough funds have this figure yet.</span>'}
      </div>
      <button type="button" class="backlink" id="back">Cancel</button>`;
    host.querySelectorAll("[data-th]").forEach(b =>
      b.addEventListener("click", () => chooseThreshold(open, b.dataset.label, Number(b.dataset.th))));
    document.getElementById("back").addEventListener("click", closePanel);
    return;
  }

  // Nothing open: the menu of what is left to add.
  const used = new Set(steps.map(s => s.type));
  const pills = []
    .concat(used.has("category") ? [] : [{key: "category", label: "Category"}])
    .concat(FILTER_DEFS.filter(d => !used.has(d.key)).map(d => ({key: d.key, label: d.label})));

  if (!pills.length) {
    host.innerHTML = '<p class="qwhat">Every filter we have is already applied. '
      + "Remove one above to try a different combination.</p>";
    return;
  }
  host.innerHTML = `<p class="sidehead">${steps.length ? "Add another filter" : "Start with a filter"}</p>
    <div class="pills">
      ${pills.map(p => `<button type="button" class="pill" data-open="${p.key}">${esc(p.label)}</button>`).join("")}
    </div>`;
  host.querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", () => selectFilterType(b.dataset.open)));
}

function renderUtil() {
  const el = document.getElementById("utilrow");
  el.innerHTML = `
    ${steps.length ? '<button type="button" class="utilbtn" id="reset">Start over</button>' : ""}
    <button type="button" class="utilbtn" id="chPeriod">Return period: ${STATE.period}</button>
    <button type="button" class="utilbtn" id="chWindow">Rolling window: ${STATE.window}Y</button>`;
  if (steps.length) document.getElementById("reset").addEventListener("click", () => {
    steps = []; renderAll();
  });
  // builderHost sits ABOVE this row in the sidebar, so opening it from
  // here changes something out of view rather than beside the button
  // that was just pressed -- from the bottom of a long sidebar this read
  // as the button doing nothing at all. Scroll it into view on purpose;
  // a no-op when it is already visible.
  document.getElementById("chPeriod").addEventListener("click", () => {
    open = "__period__"; stage = "period"; renderAll();
    document.getElementById("builderHost").scrollIntoView({behavior: "smooth", block: "nearest"});
  });
  document.getElementById("chWindow").addEventListener("click", () => {
    open = "__window__"; stage = "window"; renderAll();
    document.getElementById("builderHost").scrollIntoView({behavior: "smooth", block: "nearest"});
  });
}

function closePanel() { open = null; stage = null; renderAll(); }

function selectFilterType(key) {
  if (key === "category") { open = "category"; stage = "main"; renderAll(); return; }
  const def = FILTER_DEFS.find(d => d.key === key);
  open = key;
  if (def.axis === "period" && !periodAsked) { stage = "period"; renderAll(); return; }
  if (def.axis === "window" && !windowAsked) { stage = "window"; renderAll(); return; }
  stage = "main";
  renderAll();
}

async function choosePeriod(p) {
  periodAsked = true;
  const err = await loadUniverse(p, STATE.window);
  if (err) { lockAll(err); return; }
  if (open === "__period__") { open = null; stage = null; }
  else {
    const def = FILTER_DEFS.find(d => d.key === open);
    stage = (def.axis === "window" && !windowAsked) ? "window" : "main";
  }
  renderAll();
}
async function chooseWindow(w) {
  windowAsked = true;
  const err = await loadUniverse(STATE.period, w);
  if (err) { lockAll(err); return; }
  if (open === "__window__") { open = null; stage = null; }
  else { stage = "main"; }
  renderAll();
}
function chooseCategory(name) {
  steps.push({type: "category", value: name});
  open = null; stage = null;
  renderAll();
}
function chooseThreshold(key, label, value) {
  steps.push({type: key, threshold: value, presetLabel: label});
  open = null; stage = null;
  renderAll();
}

/* ---- rendering: the results panel -------------------------------------- */
const SHOWN = 40;
function renderResults() {
  const pool = sortPool(currentPool());
  document.getElementById("rhead").innerHTML = steps.length
    ? "<b>" + nfmt(pool.length) + "</b> of " + nfmt(ALL.length) + " funds clear "
      + (steps.length === 1 ? "your filter." : "all " + steps.length + " filters.")
    : "All <b>" + nfmt(ALL.length) + "</b> funds. Add a filter on the left to narrow this down.";

  const rows = document.getElementById("frows");
  const foot = document.getElementById("rfoot");
  if (!pool.length) {
    rows.innerHTML = '<p class="empty">No fund clears every filter you’ve '
      + "set. Remove one on the left.</p>";
    foot.textContent = "";
    return;
  }
  const shown = pool.slice(0, SHOWN);
  rows.innerHTML = shown.map(f => `
    <a class="frow" href="/#/fund/${encodeURIComponent(f.c)}">
      <span class="fname"><b>${esc(f.n)}</b><span class="fsub">${esc(f.a || "")}${
        f.k ? " · " + esc(f.k) : ""}</span></span>
      <span class="fval">${esc(rowMetric(f))}</span>
    </a>`).join("");
  foot.textContent = pool.length > shown.length
    ? "Showing the strongest " + shown.length + " of " + nfmt(pool.length) + "."
    : "";
}

function renderAll() {
  renderTrail();
  renderFunnel();
  renderBuilder();
  renderUtil();
  renderResults();
}

function lockAll(status) {
  document.getElementById("trail").innerHTML = "";
  document.getElementById("funnel").innerHTML = "";
  document.getElementById("utilrow").innerHTML = "";
  const host = document.getElementById("builderHost");
  document.getElementById("rhead").textContent = "";
  document.getElementById("frows").innerHTML = "";
  document.getElementById("rfoot").textContent = "";
  if (window.fcLocked) {
    window.fcLocked(host, "The fund screener",
      "Every filter here reads through each fund’s actual return, "
      + "risk and rolling-window history — that is the part that "
      + "is paid for.");
  } else {
    host.innerHTML = '<p class="empty">The screener is part of the paid '
      + "plan. Sign in with a subscribed account to use it.</p>";
  }
}

async function start() {
  const err = await loadUniverse(STATE.period, STATE.window);
  if (err) { lockAll(err); return; }
  renderAll();
}
start();
</script>
</body>
</html>
